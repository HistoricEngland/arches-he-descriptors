
services:
    nginx-archeshedescriptors:
      container_name: nginx-archeshedescriptors
      image: nginx:latest
      ports:
        - "8080:80"
      volumes:
        - ./docker/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - archeshedescriptors-network

    db-archeshedescriptors:
      container_name: db-archeshedescriptors
      image: postgis/postgis:14-3.2
      volumes:
        - ../../arches_he_descriptors-postgres-data:/var/lib/postgresql/data
        - ../../arches_he_descriptors-postgres-log:/var/log/postgresql
        - ./docker/init-unix.sql:/docker-entrypoint-initdb.d/init.sql # to set up the DB template
      ports:
        - '5433:5432'
      env_file: 
        - ./docker/env_file.env
      networks:
        - archeshedescriptors-network

    elastic-bindmount-init-archeshedescriptors:
      image: alpine
      container_name: elastic-bindmount-init-archeshedescriptors
      restart: "no"
      entrypoint: |
        /bin/sh -c "chown 1000:1000 /esBindMount"
      volumes:
        - ../../arches_he_descriptors-elasticsearch-data:/esBindMount


    elasticsearch-archeshedescriptors:
      container_name: elasticsearch-archeshedescriptors
      image: elasticsearch:8.5.0
      volumes:
        #- ../../elasticsearch_data_arches_he_descriptors:/usr/share/elasticsearch/data
        - ../../arches_he_descriptors-elasticsearch-data:/usr/share/elasticsearch/data
      ports:
        - "9201:9200"
        - "9301:9300"
      env_file: 
        - ./docker/env_file.env
      networks:
        - archeshedescriptors-network
      depends_on:
        - elastic-bindmount-init-archeshedescriptors

    rabbitmq-archeshedescriptors:
      container_name: rabbitmq-archeshedescriptors
      image: rabbitmq:3.8-management
      hostname: my-rabbit
      volumes:
        - rabbitmq-data:/var/lib/rabbitmq/mnesia/rabbit@my-rabbit
        - rabbitmq-logs:/var/log/rabbitmq/log
      ports:
        - 5673:5672
        - 15673:15672
      networks:
        - archeshedescriptors-network


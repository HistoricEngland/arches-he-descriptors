    archeshedescriptors-livereload:
      profiles:
        - livereload
      container_name: archeshedescriptors-livereload
      image: he/arches_he_descriptors:dev_build
      command: run_livereload
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches_he_descriptors:/web_root/arches_he_descriptors
      env_file:
        - ./docker/env_file.env
      ports:
        - 35729:35729      
      depends_on:
          - archeshedescriptors
      stdin_open: true
      tty: true
    
    archeshedescriptors-webpack:
      container_name: archeshedescriptors-webpack
      image: he/arches_he_descriptors:dev_build
      command: run_webpack
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches_he_descriptors:/web_root/arches_he_descriptors
      env_file:
        - ./docker/env_file.env
      ports:
        - 8028:8021
      depends_on:
          - archeshedescriptors
      stdin_open: true
      tty: true

networks:
  default:
    external: true
    name: archeshedescriptors-network

volumes:
    arches-log:
    arches-static:
